<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter - OMviews</title>
  <style>
    :root { --primary: #4f46e5; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: white; padding: 40px 20px; text-align: center; }
    header a { color: white; text-decoration: none; font-size: 0.9rem; opacity: 0.9; }
    main { max-width: 600px; width: 100%; margin: -20px auto 40px; padding: 0 20px; flex: 1; }
    .calc-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; }
    input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; background: white; }
    button { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    button:hover { background: #4338ca; }
    .result { margin-top: 24px; padding: 16px; background: #e0e7ff; border-radius: 8px; text-align: center; font-size: 1.2rem; font-weight: 700; color: var(--primary); display: none; }
    footer { background: #fff; border-top: 1px solid var(--border); padding: 20px; text-align: center; color: var(--muted); font-size: 0.9rem; margin-top: auto; }
    footer a { color: var(--muted); text-decoration: none; margin: 0 10px; }
  </style>
</head>
<body>
  <header>
    <p><a href="index.html">&larr; Back to Directory</a></p>
    <h1 style="margin-top: 10px;">Temperature Converter</h1>
  </header>
  <main>
    <div class="calc-card">
      <div class="form-group">
        <label for="temp">Temperature Value</label>
        <input type="number" id="temp" placeholder="e.g. 100" value="0">
      </div>
      <div class="form-group">
        <label for="fromUnit">From</label>
        <select id="fromUnit">
          <option value="C">Celsius (&deg;C)</option>
          <option value="F">Fahrenheit (&deg;F)</option>
          <option value="K">Kelvin (K)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="toUnit">To</label>
        <select id="toUnit">
          <option value="F">Fahrenheit (&deg;F)</option>
          <option value="C">Celsius (&deg;C)</option>
          <option value="K">Kelvin (K)</option>
        </select>
      </div>
      <button onclick="convertTemp()">Convert Temperature</button>
      <div id="result" class="result"></div>
    </div>
  </main>
  <footer>
    <a href="privacy-policy.html">Privacy Policy</a> | <a href="terms.html">Terms</a> | <a href="contact.html">Contact</a>
  </footer>
  <script>
    function convertTemp() {
      const val = parseFloat(document.getElementById('temp').value);
      const from = document.getElementById('fromUnit').value;
      const to = document.getElementById('toUnit').value;
      if (isNaN(val)) return;

      let celsius;
      if (from === 'C') celsius = val;
      else if (from === 'F') celsius = (val - 32) * (5/9);
      else if (from === 'K') celsius = val - 273.15;

      let res;
      if (to === 'C') res = celsius;
      else if (to === 'F') res = (celsius * (9/5)) + 32;
      else if (to === 'K') res = celsius + 273.15;

      const resDiv = document.getElementById('result');
      resDiv.innerHTML = `${val}&deg;${from} = <strong>${res.toFixed(2)}&deg;${to}</strong>`;
      resDiv.style.display = 'block';
    }
  </script>
</body>
</html>
