<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Case Converter - OMviews</title>
  <style>
    :root { --primary: #4f46e5; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: white; padding: 40px 20px; text-align: center; }
    header a { color: white; text-decoration: none; font-size: 0.9rem; opacity: 0.9; }
    main { max-width: 700px; width: 100%; margin: -20px auto 40px; padding: 0 20px; flex: 1; }
    .calc-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    textarea { width: 100%; height: 180px; padding: 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; margin-bottom: 16px; resize: vertical; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; }
    button { flex: 1; min-width: 140px; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button:hover { background: #4338ca; }
    footer { background: #fff; border-top: 1px solid var(--border); padding: 20px; text-align: center; color: var(--muted); font-size: 0.9rem; margin-top: auto; }
    footer a { color: var(--muted); text-decoration: none; margin: 0 10px; }
  </style>
</head>
<body>
  <header>
    <p><a href="index.html">&larr; Back to Directory</a></p>
    <h1 style="margin-top: 10px;">Text Case Converter</h1>
  </header>
  <main>
    <div class="calc-card">
      <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>
      <div class="btn-group">
        <button onclick="toUpper()">UPPERCASE</button>
        <button onclick="toLower()">lowercase</button>
        <button onclick="toTitle()">Title Case</button>
      </div>
    </div>
  </main>
  <footer>
    <a href="privacy-policy.html">Privacy Policy</a> | <a href="terms.html">Terms</a> | <a href="contact.html">Contact</a>
  </footer>
  <script>
    const txt = document.getElementById('textInput');
    function toUpper() { txt.value = txt.value.toUpperCase(); }
    function toLower() { txt.value = txt.value.toLowerCase(); }
    function toTitle() {
      txt.value = txt.value.toLowerCase().replace(/(?:^|\s|-)\S/g, x => x.toUpperCase());
    }
  </script>
</body>
</html>
